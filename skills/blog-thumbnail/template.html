<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog thumbnail template</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; }
  main { width: 1200px; height: 630px; padding: 60px 70px;
    display: grid; grid-template-rows: auto 1fr auto;
    background: #fafaf8; color: #1c1c19; font: 26px/1.3 system-ui, sans-serif; }
  h1 { align-self: center; margin: 0; font-size: 76px; line-height: 1.08;
    letter-spacing: -.04em; overflow-wrap: anywhere; }
  footer { display: flex; justify-content: space-between; gap: 24px;
    padding-top: 18px; border-top: 2px solid #cfcec3; }
</style>
<main>
  <strong data-field="category">Web Development</strong>
  <h1 data-field="title">What I learned rebuilding my portfolio</h1>
  <footer><span data-field="author">Alex Morgan</span>
    <span data-field="date">17 November 2026</span></footer>
</main>
</html>
